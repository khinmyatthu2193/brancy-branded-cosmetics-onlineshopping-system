{% extends 'base.html' %}

{% load static %}
{% block content %}

    <style>
          
        /* Columns */
        .container {
            display: flex;
            justify-content: center;
            /* Centers the .right-column horizontally */
            align-items: center;
            /* Centers the .right-column vertically (if needed) */
            height: 100vh;
            /* Optional: makes the container fill the full viewport height */
            padding: 15px;
        }

        .right-column {
            width: 100%;
            padding: 100px;
            max-width: 1200px;
            margin-left: 50px;
            margin-top: 0px;

        }

        /* Categories */
        .category {
            margin-bottom: 10px;
            cursor: pointer;
        }

        .sublist {
            display: none;
            margin-left: 15px;
            list-style-type: none;
        }

        .sublist li {
            margin-bottom: 5px;
        }

        /* Product Layout */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 15px;
            justify-content: center;
            padding: 10px;
        }

        .product {
            position: relative;
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .product img {
            max-width: 100%;
            transition: transform 0.3s ease;
            display: block;
        }

        .product:hover img {
            transform: scale(1.1);
        }

        .product a {
            display: none;
            position: absolute;
            top: 80%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.355);
            color: white;
            padding: 10px;
            border-radius: 5px;
        }

        .product:hover a {
            display: block;
        }
        
    </style>
</head>

    <script>
        function toggleSublist(id) {
            var sublist = document.getElementById(id);
