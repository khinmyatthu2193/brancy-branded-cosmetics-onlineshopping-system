{% extends 'base.html' %}

{% load static %}
{% block content %}
<style>
  .container {
            width: 100%;
        }

        .acc {
            background-image: url("{% static 'imges/breadcrumb-01.jpg' %}");
            background-position: top;
            background-repeat: no-repeat;
            height: 200px;
            text-align: center;
            color: rgba(0, 0, 0, 0.5);
            width: 100%;
            opacity: 0.7;

        }

        .acc h1 {
            font-size: 40px;
            color: #000;
            margin-top: 30px;
            padding: 20px;

        }

        .acc nav {
            font-size: 1.2em;
            color: #444;
        }

       .acc nav a {
            color: #444;
            text-decoration: none;
        }

       .acc nav a:hover {
            text-decoration: underline;
        }
        
       
        /* Styles for the login form */
.login-form {
  background-color: #ffffff; /* White background for the form */
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    text-align: center;
    width: 300px;
    margin: 0 auto; /* Center the form */
    margin-top: 25px;
    margin-bottom: 25px;
}

.login-form h2 {
    text-align: center;
    color: #d81b60; /* Change this to your preferred color */
    margin-bottom: 10px;
}

.login-form input[type="text"],
.login-form input[type="email"],
.login-form input[type="password"] {
  width: 100%;
    padding: 10px;
    margin: 10px 0;
    border: 1px solid #e0a8d9; /* Initial pink border */
    border-radius: 5px;
    font-size: 16px;
    outline: none;
    transition: border-color 0.3s ease; /* Smooth transition for border color */
}

.login-form input[type="text"]:focus,
.login-form input[type="email"]:focus,
.login-form input[type="password"]:focus {
  border-color: #ca6694; /* Darker pink on focus */
  box-shadow: 0 0 7px rgba(216, 27, 96, 0.5); /* Subtle glow effect */}

.password-wrapper {
    position: relative;
}

.toggle-password {
    position: absolute;
    top: 50%;
    right: 10px;
    transform: translateY(-50%);
    cursor: pointer;
}

.login-form button {
  width: 100%;
    background-color: #e91e63; /* Pink button */
    color: white;
    padding: 10px;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    cursor: pointer;
    margin-top: 15px;
    transition: background-color 0.3s ease
}

.login-form button:hover {
  background-color: #d81b60;/* Lighter shade on hover */
}

.login-link {
    text-align: center;
    margin-top: 20px;
}

.login-link a {
  color: #e91e63; /* Link color */
  text-decoration: none;
    
}
.login-link a:hover {
    text-decoration: underline;
}

.error {
  color: red; /* Error message color */
    font-size: 12px;
    margin-top: 5px;
    text-align: left; /* Center the text */
    display: block;/* Ensures errors are on a new line */
}

</style>
<body>
  

  <div class="container">
    <div class="acc">
        <h1>ACCOUNT</h1>
        <nav>
            <a href="{% url 'home' %}">Home</a> / Account
        </nav>
    </div>
</div>

<div class="login-form" id="loginForm">
  <h2>Sign In</h2>
  <form method="POST" action="{% url 'login' %}" id="loginForm">
      {% csrf_token %}
      
      <div>
          <input type="text" id="username" name="username" placeholder="Username" required>
          <!-- Error message for username -->
          <span class="error" id="loginUsernameError"></span>
      </div>
      
      <div>
          <input type="email" id="email" name="email" placeholder="Email" required>
          <!-- Error message for email -->
          <span class="error" id="loginEmailError"></span>
      </div>
      
      <div class="password-wrapper">
          <input type="password" id="password" name="password" placeholder="Password" required>
          <span class="toggle-password" onclick="togglePasswordVisibility()">
              <i class="ph ph-eye-closed" id="eyeIcon"></i>
          </span>
      </div>
      
      {% if messages %}
          <ul class="messages" style="color: red;">
              {% for message in messages %}
                  <li class="{{ message.tags }}">{{ message }}</li>
              {% endfor %}
          </ul>
      {% endif %}
      
      <button type="submit">SIGN IN</button>
  </form>
  <p class="login-link">Don't have an account? <a href="{% url 'register' %}">Create account</a></p>
</div>



    <script>
      document.querySelectorAll('.toggle-password').forEach(function(toggle) {
        toggle.addEventListener('click', function() {
            let passwordField = this.previousElementSibling; // Select the password field
            let type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password'; // Toggle type
            passwordField.setAttribute('type', type); // Set the new type

            // Toggle eye icons
            let eyeIcon = this.querySelector('#eyeIcon');
            if (type === 'text') {
                eyeIcon.classList.remove('ph-eye-closed'); // Remove the 'closed eye' class
                eyeIcon.classList.add('ph-eye'); // Add the 'open eye' class
            } else {
                eyeIcon.classList.remove('ph-eye'); // Remove the 'open eye' class
                eyeIcon.classList.add('ph-eye-closed'); // Add the 'closed eye' class
            }
        });
    });
    </script>
    <!-- sticky -->
<script>
    window.addEventListener('scroll', function () {
      const header = document.querySelector('.header_top');
      header.classList.toggle('sticky-header', window.scrollY > 50);
    });
  </script>
  <!-- search -->
  <script>
  
    const searchBar = document.querySelector('.search-container input');
    const searchContainer = document.querySelector('.search-container');
  
    searchBar.addEventListener('focus', () => {
      searchContainer.style.width = "250px"; // Expand on focus
    });
  
    searchBar.addEventListener('blur', () => {
      searchContainer.style.width = "240px"; // Revert when focus is lost
    });
  
 
    /////////////////////////////////////

    document.getElementById("loginForm").addEventListener("submit", async function(event) {
    event.preventDefault(); // Prevent the form from submitting traditionally

    // Clear previous errors
    document.getElementById("loginUsernameError").innerText = "";
    document.getElementById("loginEmailError").innerText = "";

    // Gather form data
    const formData = new FormData(event.target);

    try {
        const response = await fetch("{% url 'login' %}", {
            method: "POST",
            body: formData,
            headers: {
                "X-Requested-With": "XMLHttpRequest" // To signal this is an AJAX request
            }
        });

        const result = await response.json();

        // Check for a successful login
        if (result.status === "success") {
            // Optionally redirect to the home page
            cart = result.cart;
            count1 = cart.reduce((acc, item) => acc + item.quantity, 0);
            cartCount.innerHTML = count1;
            updateCartDisplay();

            // Save the cart data to local storage
            saveCartToLocalStorage();
            window.location.href = "{% url 'home' %}";
        } else if (result.status === "error") {
            // Display error messages returned from the backend
            window.location.href = "{% url 'login' %}";
            if (result.errors.login) {
                document.getElementById("loginUsernameError").innerText = result.errors.login;
            }
            // You can add more error handling here if other fields need it
        }
        if (result.status === "success") {
            // Optionally redirect to the home page
            wishlist = result.wishlist;
            count2 = wishlist.reduce((acc, item) => acc + item.quantity, 0);
            wishlistCount.innerHTML = count2;

            // Save the cart data to local storage
            saveWishlistToLocalStorage();
            window.location.href = "{% url 'home' %}";
        } else if (result.status === "error") {
            // Display error messages returned from the backend
            window.location.href = "{% url 'login' %}";
            if (result.errors.login) {
                document.getElementById("loginUsernameError").innerText = result.errors.login;
            }
            // You can add more error handling here if other fields need it
        }
    } catch (error) {
        console.error("Error during login:", error);
    }
});
</script>
  
  

</body>
</html>
{% endblock %}
